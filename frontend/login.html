<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar | Conferência de Caixa</title>
  <meta name="author" content="Gilmario Lima">
  <link rel="icon" href="/static/icone.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=acesso-1">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-brand"><span class="brand-mark"><i class="bi bi-receipt-cutoff" aria-hidden="true"></i></span><span>Conferência de Caixa</span></div>
    <section class="panel login-panel" aria-labelledby="login-title">
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p class="login-description">Entre com o acesso dos donos para conferir o caixa.</p>
      <form id="loginForm">
        <label class="form-label" for="usuario">Usuário</label>
        <input class="form-control" id="usuario" name="usuario" autocomplete="username" maxlength="128" required autofocus>
        <label class="form-label mt-3" for="senha">Senha</label>
        <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" maxlength="1024" required>
        <p id="loginError" class="login-error" role="alert" hidden></p>
        <button class="btn btn-primary w-100 mt-4" id="btnEntrar" type="submit">Entrar</button>
      </form>
    </section>
    <footer>Conferência de Caixa · Gilmario Lima</footer>
  </main>
  <script src="/static/login.js?v=1"></script>
</body>
</html>
